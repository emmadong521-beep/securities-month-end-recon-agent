[project]
name = "securities-month-end-recon-agent"
version = "0.1.0"
description = "证券公司月结差异归因 Agent"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "duckdb>=1.0.0",
  "openpyxl>=3.1.0",
  "pydantic>=2.7.0",
  "pytest>=8.0.0",
  "streamlit>=1.35.0",
  "streamlit-extras>=0.4.0",
  "streamlit-aggrid>=1.0.5",
  "plotly>=5.22.0",
  "python-dotenv>=1.0.0",
  "PyYAML>=6.0.0",
  "pypdf>=4.2.0",
  "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
